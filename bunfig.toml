# Préchargement du plugin de formats de jeu IEVR.
#
# Bun exécute ce script AVANT tout module utilisateur lors de `bun run` (et `bun test`).
# register.ts appelle Bun.plugin({ name: "nie-game-formats", setup }) une seule fois.
# Après ça, tout `import` de .g4tx / .cfg.bin / .objbin / .g4pkm / .lip / .mev / .g4md
# est intercepté par les handlers onLoad sans configuration supplémentaire.
#
# Pour l'usage bundler, passer le plugin explicitement :
#   Bun.build({ plugins: [(await import("nie-plugin/register")).default] })
preload = ["./packages/nie-plugin/src/register.ts"]

[install]
linker = "isolated"       # pnpm-style strict node_modules

# Pas de [install.scopes] ici, et c'est délibéré depuis la fusion : les paquets `@rosegriffon/*`
# (types, db, ui, auth, azalee, inagle) vivent DANS ce dépôt et se résolvent en
# `workspace:packages/…` — aucun registre à interroger. Les seuls scopes réellement tirés d'un
# registre privé sont `@aphrody-code/*` et `@rpbey/*`, configurés dans `.npmrc` avec
# `${GITHUB_TOKEN}`.
#
# Le bloc qui vivait ici déclarait le scope `@rose-griffon` (avec tiret — un nom que ce monorepo
# ne porte nulle part) et un jeton `$GH_PACKAGES_TOKEN` défini nulle part : configuration morte
# qui, si un jour un paquet portait ce nom, l'aurait authentifié avec un jeton vide.

[test]
# Trois préchargements : le plugin de formats du jeu, les globals DOM (document/window)
# dont les tests de composants React d'`apps/azalee` et `packages/ui` ont besoin, et la
# source de données de la bibliothèque du wiki.
# `happydom.ts` rend à Bun ses primitives réseau juste après avoir posé le DOM — sans quoi
# tout `fetch` hors `localhost:3000` échoue en « Cross-Origin Request Blocked » et
# `Bun.serve` refuse les `Response` de happy-dom. Le détail est dans le fichier.
# `preload.ts` injecte le client du miroir SQLite : depuis le lot J2, la bibliothèque n'a
# plus de source par défaut et lève si personne ne lui en donne une (cf. le fichier).
preload = [
	"./packages/nie-plugin/src/register.ts",
	"./packages/nie-plugin/src/happydom.ts",
	"./packages/azalee-tools/test/preload.ts",
]
coverage = false

[run]
silent = false
