# niers — moteur Rust d'Inazuma Eleven: Victory Road, et forge de son binaire.
#
# OBJECTIF : produire `nie.exe` **identique au byte près** depuis ce workspace.
# Les crates sont donc rangées par rôle dans cette chaîne (cf. docs/FORGE.md) :
#
#   crates/forge/   la chaîne de production du binaire et le reverse qui l'alimente
#                   (nie-pe modèle PE · nie-asm encodeur x86-64 · nie-forge CLI ·
#                    nie-re/nie-dump/nie-index/nie-seed/nie-queue/nie-trace échafaudage RE)
#   crates/engine/  le moteur qui fait tourner le jeu en Rust — la matière que la
#                   forge doit finir par émettre (core, formats, data, render, …)
#   crates/tools/   outillage périphérique (CLI, wiki, steam, serveurs, tâches)
#   crates/archive/ portages conservés en référence, hors build
#
# Conventions alignées sur l'écosystème aphrody (nightly-2026-05-17, edition 2024,
# lints RFC 3389, RE pur-Rust goblin+iced-x86). Voir docs/ARCHITECTURE.md.
[workspace]
resolver = "3"
members = ["crates/forge/*", "crates/engine/*", "crates/tools/*"]
# nie-engine = portage RE du moteur Level-5 (~15k LOC, 434 // EXTERN:) consommé par AUCUNE crate vivante.
# Hors build/test workspace, conservé comme RÉFÉRENCE de portage en lecture seule (cf. docs/PLAN.md).
exclude = ["crates/archive/nie-engine"]

[workspace.package]
edition = "2024"
version = "0.5.10"
license = "MIT"
authors = ["Rose Griffon"]
repository = "https://github.com/aphrody-code/nie"
rust-version = "1.97"

[workspace.dependencies]
# erreurs : thiserror par-crate, anyhow en propagation, miette pour le CLI
anyhow = "1"
byteorder = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# wasm / navigateur
wasm-bindgen = { version = "=0.2.125" }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { version = "0.1" }
getrandom = { version = "0.2" }
web-time = "1.1"
parking_lot = "0.12"


# sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# base de connaissance + frontière
rusqlite = { version = "0.37", features = ["bundled"] }
redis = { version = "0.27", features = ["r2d2"] }
r2d2 = "0.8"

# CLI / logging (conventions aphrody)
clap = { version = "4", features = ["derive", "color", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter"] }

# orchestration de jobs asynchrones (nie-tasks — architecture inspirée de sd-task-system,
# implémentation originale) : runtime tokio déjà tiré transitivement par tauri (nie-explorer)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# RE pur-Rust : goblin PE/ELF + iced-x86 désassembleur
goblin = "0.10"
iced-x86 = "1.21"
# Vues typées sans copie sur les en-têtes ELF/PE (module `headers` d'aphrody-re).
zerocopy = { version = "0.8", features = ["derive"] }
# Triage PE / disasm / strings / entropy. Crate INTERNALISÉ le 2026-08-15 : il
# vivait dans `../aphrody`, hors du dépôt, et une dépendance de chemin vers un
# répertoire voisin faisait dépendre la compilation de niers d'un arbre qui n'est
# ni versionné ici ni garanti présent. Seul le noyau de triage est repris
# (`lib.rs` + `headers`) ; les modules forensics d'aphrody — adobe, asar,
# electron, golang, google — et les modules sous drapeau — leveldb, magika,
# yara — sont écartés : `nie-re` n'appelle que `triage()` et `Format`.
aphrody-re = { path = "crates/forge/aphrody-re" }

# décodage audio CRI (HCA, ACB, AWB) — licence MIT
cridecoder = { version = "0.2.3", default-features = false }

# AES (RustCrypto, MIT/Apache) — déchiffrement AES-256-CBC du cpk_list.cfg.bin
# (clé/IV embarqués dans nie.exe, reversés ; cf. cpk.rs). no_std + alloc.
aes = { version = "0.8", default-features = false }

# hash / util
sha2 = "0.10"
hex = "0.4"
memmap2 = "0.9"
rayon = "1"
hashbrown = "0.14"

# Recherche de fichiers et de contenu — le moteur de ripgrep/fd, pris en bibliothèque.
# `ignore` fournit le parcours parallèle qui respecte .gitignore ; `grep-*` la recherche
# ligne à ligne. Les prendre plutôt que réécrire un walk maison : ce sont les mêmes
# briques que les outils de référence, et elles sont d'un seul auteur (BurntSushi).
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"

# RE en direct (runtime) : lecture mémoire d'un nie.exe sous Wine via process_vm_readv(2).
# FFI Linux-only, isolé dans le seul crate nie-trace (cf. son lib.rs).
libc = "0.2"

# crates internes
# forge : production du binaire
nie-pe = { path = "crates/forge/nie-pe" }
nie-asm = { path = "crates/forge/nie-asm" }
nie-forge = { path = "crates/forge/nie-forge" }
nie-index = { path = "crates/forge/nie-index" }
nie-trace = { path = "crates/forge/nie-trace" }
nie-re = { path = "crates/forge/nie-re" }
# Minidump (.dmp) : parsing + scan AOB. Extrait de nie-re pour n'avoir AUCUNE dépendance
# (hors thiserror) — c'est ce qui le rend liable par nie-explorer, contrairement à nie-re.
nie-dump = { path = "crates/forge/nie-dump" }
nie-queue = { path = "crates/forge/nie-queue" }
nie-seed = { path = "crates/forge/nie-seed" }
nie-formats = { path = "crates/engine/nie-formats" }
nie-explore = { path = "crates/engine/nie-explore" }
nie-headless = { path = "crates/engine/nie-headless" }
nie-save = { path = "crates/engine/nie-save" }
nie-wiki = { path = "crates/tools/nie-wiki" }
nie-core = { path = "crates/engine/nie-core" }
nie-data = { path = "crates/engine/nie-data" }
# PAS de `nie-engine` ici : la crate est `exclude` du workspace (cf. plus haut) et aucune crate
# vivante ne la consomme. La déclarer invitait un `nie-engine.workspace = true` qui aurait ramené
# dans le build un portage conservé en lecture seule.
nie-model-serve = { path = "crates/tools/nie-model-serve" }
nie-zukan = { path = "crates/tools/nie-zukan" }
nie-lua = { path = "crates/engine/nie-lua" }
nie-app = { path = "crates/engine/nie-app" }
nie-render3d = { path = "crates/engine/nie-render3d" }
nie-aphrody = { path = "crates/engine/nie-aphrody" }
# nie-ui : source unique, typée, des jetons de design du jeu (couleurs OKLCH, géométrie,
# mouvement) — génère le CSS de packages/inacord-ui/src/shell/game-tokens.css et relie
# nie-formats::sprite_sheet (icônes) aux jetons pour le Rust qui compose des images.
nie-ui = { path = "crates/engine/nie-ui" }
# `nie-runtime` : le moteur de match. Declare ici parce que `nie-ffi` le consomme desormais —
# c'est ce qui rend la simulation pilotable depuis Python (`niepy`) et donc depuis Ren'Py.
nie-runtime = { path = "crates/engine/nie-runtime" }
nie-viola = { path = "crates/engine/nie-viola" }
nie-steam = { path = "crates/tools/nie-steam" }

# chaîne « image → SVG → raster » (skill pixel-perfect, crate nie-aphrody).
# Choix mesurés le 2026-09-05, avec les rejets et leur raison :
# plugins/niers-plugin/skills/pixel-perfect/references/bibliotheques.md
# À retenir : `dssim` est AGPL (banni, `image-compare` rend le même SSIM en MIT),
# potrace est GPL et sans crate, et `vtracer` tirerait un SECOND `image` (^0.23)
# plus clap 2 et pyo3. La vectorisation, elle, n'a tiré AUCUNE dépendance : suivre le
# contour d'un masque puis le simplifier tient dans `nie_aphrody::pixel`, et rend des chemins
# lisibles là où un traceur générique en rend des milliers.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
image-compare = "0.5"
palette = { version = "0.7", default-features = false, features = ["std"] }
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"

# tests CLI (dev-dep commune)
assert_cmd = "2"
tempfile = "3"

# Lints workspace (RFC 3389, hérités via [lints] workspace = true dans chaque crate)
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# Dev rapide pour la boucle RE : on optimise les DEPENDANCES (iced-x86, goblin, rusqlite,
# rayon…) à opt-level=2 — la boucle disasm/seed/propagate tourne ~5-10x plus vite en dev —
# tout en gardant les crates niers à opt-level=0 (compilation rapide à chaque edit).
[profile.dev.package."*"]
opt-level = 2
