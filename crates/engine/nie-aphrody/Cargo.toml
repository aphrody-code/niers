[package]
name = "nie-aphrody"
description = "Runtime typé du pet Codex Aphrody v2 : atlas RGBA, animations et directions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Le dossier du jeu (`gisement`) parse chara_param, skill_config et aura_skill_config : ces
# parseurs vivent dans nie-data, et il n'y a pas de cycle — nie-data n'importe pas cette crate.
nie-data = { workspace = true, features = ["serde", "std"] }
# `sprite_sheet` : atlas → CSS (2 modes) + SVG `<symbol>` + JSON. Le module existe et porte
# déjà les rectangles du jeu ; `pixel` lui APPORTE une planche assemblée au lieu d'un `.g4tx`,
# il ne réimplémente ni le CSS ni le SVG.
nie-formats.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
png = "0.18"

# Chaîne « image → SVG → raster » (module `pixel`). Choix mesurés et rejets documentés dans
# plugins/niers-plugin/skills/pixel-perfect/references/bibliotheques.md — notamment `dssim`
# écarté parce qu'AGPL, et `vtracer` parce qu'il tirerait un second `image`.
image.workspace = true
image-compare.workspace = true
palette.workspace = true
resvg.workspace = true
usvg.workspace = true
tiny-skia.workspace = true

[features]
# `fs` : les points d'entrée qui lisent le DISQUE. Par défaut, parce que la plupart des hôtes en
# ont un ; à couper pour le web et le mobile, où `Image::depuis_octets` et `Pet::from_png`
# suffisent — tout le reste de la crate travaille déjà en mémoire.
default = ["fs"]
fs = []

[[bin]]
name = "pixel"
path = "src/bin/pixel.rs"

[[bin]]
name = "export_aphrody"
path = "src/bin/export_aphrody.rs"

[[bin]]
name = "export_assets"
path = "src/bin/export_assets.rs"

# `design` : la feuille de couleurs du site, engendree depuis la palette mesuree. C'est le seul
# chemin par lequel une couleur atteint `packages/inacord-ui/src/shell/game-tokens.css`.
[[bin]]
name = "design"
path = "src/bin/design.rs"
