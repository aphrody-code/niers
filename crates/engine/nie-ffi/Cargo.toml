[package]
name = "nie-ffi"
description = "Frontière FFI C-ABI: expose la logique niers (CRC32 RDBN, PRNG CRand MT19937, décodage formats, VFS) à Bun et autres runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
# nom de lib par défaut = nie_ffi -> produit target/debug/libnie_ffi.so

[lints]
workspace = true

[dependencies]
# `serde` : sérialise `TeamSetup` / `MatchResult`, requis par `nie_match_simulate_json_out`.
nie-core = { workspace = true, features = ["serde"] }
nie-data = { workspace = true, features = ["serde"] }
# serde feature : active serde::Serialize sur G4tx, CfgBinFile, RdbnData, G4pkmLayout,
# G4md, LipSync, MevbinDocument, MenuObject, CpkHeader, G4pk — requis par nie_decode_json.
# Feature `textures` = décodeur G4TX/DDS → RGBA8/PNG partagé (`nie_formats::g4tx_decode`),
# utilisé par nie_g4tx_to_png (le DDS/BCn vit désormais dans nie-formats).
nie-formats = { workspace = true, features = ["serde", "textures"] }
serde_json.workspace = true
# `image` : encodage PNG des atlas de glyphes (make_glyph_png) + décodage dans les tests.
image = { version = "0.25", default-features = false, features = ["png"] }
# `nie-runtime` : le moteur de match jouable (World/step/kickoff), exposé au bloc `nie_world_*`.
# C'est ce qui permet à un runtime extérieur — la lib Python `niepy`, donc Ren'Py — de faire
# TOURNER la simulation, et pas seulement de lire des assets.
nie-runtime.workspace = true
