[package]
name = "nie-cli"
description = "Binaire `niers` : pilote la boucle RE (seed, propagate, coverage) et la frontière redis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "niers"
path = "src/main.rs"

[package.metadata.aphrody-package]
binary = "niers"
install-package = "nie-cli"
supported-os = ["linux", "macos", "windows"]

[lints]
workspace = true

[dependencies]
nie-index.workspace = true
nie-seed.workspace = true
nie-queue.workspace = true
nie-re.workspace = true
nie-trace.workspace = true
nie-computer-use = { path = "../nie-computer-use" }
nie-data = { workspace = true, features = ["serde", "std"] }
nie-formats = { workspace = true, features = ["serde", "textures", "audio-decode", "images"] }
nie-explore.workspace = true
nie-viola.workspace = true
nie-steam.workspace = true
tokio = { workspace = true }
nie-lua.workspace = true
nie-save.workspace = true
nie-wiki.workspace = true
nie-render3d = { workspace = true, features = ["gpu"] }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true

# `niers strings` : géométrie du PE (sections, ImageBase) et décodage de .text.
goblin.workspace = true
iced-x86.workspace = true

# pré-décodage sprites menu (g4tx -> DDS -> RGBA -> PNG)
# default-features=false pour exclure `encode` (intel_tex_2 / C++ ISPC = linker error)
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
png = "0.18"

# `niers find` / `niers grep` : recherche de fichiers et de contenu sur le disque.
ignore.workspace = true
globset.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
