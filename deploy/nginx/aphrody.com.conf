#
# Vhost d'Aphrody — REMPLACE `/etc/nginx/conf.d/aphrody.com.conf`.
#
# NE PAS INSTALLER DEPUIS UNE SESSION D'AGENT. Le `nginx -t` et le `reload` sont des actes
# de production (PLAN.md J5, proprietaire Codex, avec le go de l'utilisateur) :
#
#   sudo cp deploy/nginx/aphrody.com.conf /etc/nginx/conf.d/aphrody.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   for h in aphrody.com www api mcp downloads cdn nie bot admin bxc n2b; do
#       curl -sI "https://${h#aphrody.com}.aphrody.com/" | head -1
#   done
#
# ETAT MESURE LE 2026-09-05, AVANT TOUTE MODIFICATION
# ---------------------------------------------------
# Les dix hotes du bloc principal pointent `127.0.0.1:8083`, et **rien n'ecoute sur 8083** :
# `ss -ltnp` ne rend aucun processus, et les dix repondent **502** (150 octets). Seul
# `mcp.aphrody.com` fonctionne (401, ce qui est sa reponse normale sans jeton), servi par
# `127.0.0.1:8808`.
#
# Deux consequences a garder en tete :
#
#  1. Le rollback ecrit dans le PLAN — « le vhost repointe sur :8083, `aphrody-site` n'est
#     jamais arrete » — est ILLUSOIRE en l'etat : il n'y a pas de service a retrouver. Le vrai
#     rollback est de revenir a ce fichier, ce qui restaure les 502. Autrement dit : ce
#     changement ne peut rien casser sur les hotes concernes, ils sont deja hors service.
#  2. La CSP `default-src 'none'` du bloc actuel rend impossible tout site HTML+JS. Elle
#     convenait a une origine qui ne servait rien ; elle empecherait Aphrody de charger sa
#     propre feuille de style. Le bloc Aphrody n'en pose donc AUCUNE — `nie-site` pose la
#     sienne, a douze directives, et deux CSP s'additionnent : la plus stricte gagne, et le
#     resultat serait `'none'`.
#
# CE QUE CE FICHIER CHANGE
# ------------------------
#   aphrody.com, www.aphrody.com   :8083 (502) -> :8085 nie-site, sans CSP nginx
#   nie.aphrody.com                :8083 (502) -> :8790 nie-model-serve, sous limite de debit
#   api.aphrody.com                :8083 (502) -> :8085 nie-site, API SEULE (404 ailleurs)
#   les 6 autres hotes             inchanges, y compris leur CSP
#   mcp.aphrody.com                inchange, au caractere pres
#
# `nie.` et `api.` ne redirigent PAS vers `aphrody.com` : sept sous-domaines resolvent deja
# vers cette machine et n'y servaient rien, pendant que deux services du depot n'avaient
# aucune facade. Les deux sont en `noindex` et refusent le HTML — sans quoi deux origines
# rendraient le meme contenu, chacune avec son canonique.

# --- Aphrody : le site lui-meme ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aphrody.com www.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # AUCUN `add_header Content-Security-Policy` ici : `nie-site` pose la sienne sur chaque
    # reponse, et deux CSP ne se remplacent pas — le navigateur applique l'intersection.
    # Aucun `X-Content-Type-Options` ni `Referrer-Policy` non plus, pour la meme raison : la
    # crate en pose cinq, et un en-tete duplique vaut au mieux un doublon, au pire un conflit.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Le bundle est deja pre-compresse a la construction (`br` et `zstd`, cote a cote du
    # fichier nu). `gzip on` ici recompresserait a la volee ce qui l'est deja mieux.
    gzip off;

    # Les fichiers du jeu peuvent etre gros ; la crate borne deja la taille cote amont.
    client_max_body_size 1m;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sans cela, nginx demande une reponse non compressee a l'amont et la sert telle
        # quelle : la pre-compression du bundle ne servirait jamais a personne.
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # Sonde publique. `nie-site` repond son nom et ses capacites mesurees, ce qui distingue
    # « le service tourne » de « le service peut repondre » — l'index du VFS se monte en
    # tache de fond, et `/healthz` le dit au lieu de le supposer.
    location = /health {
        proxy_pass http://127.0.0.1:8085/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# --- Limites de debit ------------------------------------------------------------------------
# `nie-model-serve` DECODE a la demande : une texture coute ~100 ms, un modele assemble
# plusieurs secondes, un export video des dizaines. Mesure du 2026-09-05 : ses 4 workers
# d'alors etaient tous pris par des exports USM qui echouaient apres 20 a 40 secondes, et le
# service ne repondait plus a `/health` en 30 secondes. Il est passe a 8 workers, mais huit
# requetes lourdes simultanees suffiraient a le refermer.
#
# Ces zones sont declarees ici et n'ont d'effet que dans les blocs qui les utilisent.
limit_req_zone $binary_remote_addr zone=nie_assets:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nie_conn:10m;

# --- nie.aphrody.com : le service d'assets, decode a la demande ------------------------------
# Il sert ce que `aphrody.com/assets/` proxifie deja, mais SANS passer par le cache et les
# bornes de `nie-site` — d'ou les limites ci-dessus, qui sont ici la seule protection.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nie.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ce n'est pas un site : rien ici ne doit s'afficher dans un cadre, ni etre indexe. Un
    # decodage a la demande n'a aucune valeur en resultat de recherche, et l'indexer ferait
    # payer au service le budget de crawl d'un moteur.
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 10 requetes par seconde, avec une reserve de 20 : une page qui charge trente vignettes
    # passe, une boucle qui en demande mille est ralentie plutot que refusee.
    limit_req zone=nie_assets burst=20 nodelay;
    limit_conn nie_conn 8;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    # Un assemblage de modele peut prendre plusieurs secondes ; au-dela, c'est une panne.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Les sept autres hotes : inchanges, y compris leur CSP ----------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloads.aphrody.com cdn.aphrody.com
        bot.aphrody.com admin.aphrody.com bxc.aphrody.com n2b.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /health {
        proxy_pass http://127.0.0.1:8083/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- api.aphrody.com : l'API de lecture, et RIEN d'autre -------------------------------------
# Le meme service que `aphrody.com`, mais restreint a ses espaces de donnees. Sans cette
# restriction, l'hote servirait aussi les pages HTML : deux origines rendraient le meme
# contenu, chacune avec son propre canonique — le doublon exact que `hreflang` et `canonical`
# existent pour eviter. D'ou le 404 par defaut et le `noindex`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=nie_assets burst=40 nodelay;
    limit_conn nie_conn 16;
    limit_req_status 429;
    limit_conn_status 429;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz { proxy_pass http://127.0.0.1:8085/healthz; proxy_set_header Host $host; }
    location = /health  { proxy_pass http://127.0.0.1:8085/healthz; proxy_set_header Host $host; }
    location = /llms.txt      { proxy_pass http://127.0.0.1:8085/llms.txt; proxy_set_header Host $host; }
    location = /llms-full.txt { proxy_pass http://127.0.0.1:8085/llms-full.txt; proxy_set_header Host $host; }

    location /api/ { proxy_pass http://127.0.0.1:8085; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /f/   { proxy_pass http://127.0.0.1:8085; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /b    { proxy_pass http://127.0.0.1:8085; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # Tout le reste — les pages, le bundle — n'a rien a faire ici.
    location / { return 404; }
}

# --- HTTP -> HTTPS, pour tous les hotes de ce certificat ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com api.aphrody.com downloads.aphrody.com
        cdn.aphrody.com bot.aphrody.com admin.aphrody.com
        bxc.aphrody.com nie.aphrody.com n2b.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}

# --- mcp.aphrody.com : recopie a l'identique, ne pas modifier -------------------------------
# Ce bloc est le seul des onze qui reponde aujourd'hui (401 sans jeton, ce qui est correct).
# Il est reproduit tel quel pour que ce fichier remplace l'original sans rien perdre.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 1m;

    location = / {
        proxy_pass http://127.0.0.1:8808/mcp;
        include /etc/nginx/conf.d/snippets-mcp.inc;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8808/mcp;
        include /etc/nginx/conf.d/snippets-mcp.inc;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8808/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}
