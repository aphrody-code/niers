# Bun lit le `bunfig.toml` du répertoire COURANT, sans hériter de celui de la racine : sans ce
# fichier, `cd packages/azalee-tools && bun test` perd le plugin de formats du jeu.
#
# `test/preload.ts` pose le miroir comme source de SECOURS. Il ne perturbe pas `db.test.ts`,
# qui vérifie qu'aucune fabrique explicite n'est injectée au départ : un défaut n'en est pas
# une. Sans lui, la suite dépendrait de l'ordre des fichiers — mesuré : `remote.test.ts` rendait
# 24 tests verts seul et 13 dans la suite complète.
[test]
preload = [
	"../nie-plugin/src/register.ts",
	"../nie-plugin/src/happydom.ts",
	"./test/preload.ts",
]
coverage = false
